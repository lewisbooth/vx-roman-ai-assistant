<!doctype html>
<html lang="en" data-roman-preview="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roman storefront preview</title>
    <style>
      /* Preview only: storefront themes own the production font faces. */
      @font-face {
        font-family: GelicaSite;
        src: url("https://www.selectblinds.com/cdn/shop/t/118/assets/Gelica.woff2?v=153114203125290158031787864657")
          format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: GelicaSite;
        src: url("https://www.selectblinds.com/cdn/shop/t/118/assets/Gelica-Italic.woff2?v=147383124877374839691787864657")
          format("woff2");
        font-style: italic;
        font-weight: 400;
        font-display: swap;
      }
      body {
        margin: 0;
        background: #fafaf9;
        color: #27272a;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      app-provider {
        display: block;
      }
      header,
      footer {
        padding: 24px;
        background: #e7e5e4;
      }
      main-header {
        --button-radius: 999px;
        --color-button-tertiary-gray-fg: #27272a;
        --color-button-secondary-border: #cecbc1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .header__utilities {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .preview-search {
        display: flex;
        align-items: flex-end;
        max-width: 100%;
      }
      .preview-search label {
        min-width: 0;
        font-size: 12px;
      }
      .preview-search input {
        box-sizing: border-box;
        display: block;
        width: 240px;
        max-width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid #cecbc1;
        border-radius: 999px;
        background: #fff;
        font: inherit;
        font-size: 16px;
      }
      [data-testid="menu-account-link"] {
        display: inline-flex;
        align-items: center;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--color-button-secondary-border);
        border-radius: var(--button-radius);
        background: #fff;
        color: inherit;
        font: inherit;
      }
      main {
        max-width: 720px;
        min-height: 65vh;
        margin: 8vh auto;
        padding: 24px;
      }
      h1 {
        font-size: 32px;
        letter-spacing: -1px;
      }
      p {
        color: #52525b;
      }
    </style>
  </head>
  <body class="template-index">
    <app-provider>
      <header>
        <main-header>
          <span>Roman storefront preview</span>
          <div class="preview-search">
            <label for="preview-search">
              Search products
              <input
                id="preview-search"
                type="search"
                data-testid="menu-search-input"
                placeholder="Search this preview"
              />
            </label>
          </div>
          <div class="header__utilities">
            <button type="button" data-testid="menu-account-link">
              Profile
            </button>
          </div>
        </main-header>
      </header>
      <main id="main" tabindex="-1"><!-- roman:page --></main>
      <footer>
        Open Ask Roman beside the search field to try the fullscreen assistant.
        Use the page links above to navigate; this preview search does not query
        Shopify.
      </footer>
    </app-provider>
    <roman-ai-assistant
      data-shop="hd-dev-multi.myshopify.com"
      data-label="Roman AI Assistant"
      data-initial="R"
      data-logo-url="/src/assets/roman-logo.svg"
      data-wordmark-url="/src/assets/roman-wordmark.svg"
    ></roman-ai-assistant>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
