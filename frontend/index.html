<!doctype html>
<html lang="en" data-roman-preview="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roman storefront preview</title>
    <style>
      /* Preview only: storefront themes own the production font faces. */
      @font-face {
        font-family: GelicaSite;
        src: url("https://www.selectblinds.com/cdn/shop/t/118/assets/Gelica.woff2?v=153114203125290158031787864657")
          format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: GelicaSite;
        src: url("https://www.selectblinds.com/cdn/shop/t/118/assets/Gelica-Italic.woff2?v=147383124877374839691787864657")
          format("woff2");
        font-style: italic;
        font-weight: 400;
        font-display: swap;
      }
      body {
        margin: 0;
        background: #fafaf9;
        color: #27272a;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      app-provider {
        display: block;
      }
      header,
      footer {
        padding: 24px;
        background: #e7e5e4;
      }
      main {
        max-width: 720px;
        min-height: 65vh;
        margin: 8vh auto;
        padding: 24px;
      }
      h1 {
        font-size: 32px;
        letter-spacing: -1px;
      }
      p {
        color: #52525b;
      }
    </style>
  </head>
  <body class="template-index">
    <app-provider>
      <header>Roman storefront preview</header>
      <main id="main" tabindex="-1"><!-- roman:page --></main>
      <footer>
        Open the R button, then use the sidebar links to navigate.
      </footer>
    </app-provider>
    <roman-ai-assistant
      data-shop="hd-dev-multi.myshopify.com"
      data-label="Roman AI Assistant"
      data-initial="R"
      data-logo-url="/src/assets/roman-logo.svg"
      data-texture-url="/src/assets/ivory-texture.png"
    ></roman-ai-assistant>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
